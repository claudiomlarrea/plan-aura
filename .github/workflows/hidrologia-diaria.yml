name: Hidrología diaria

on:
  schedule:
    # Minuto 15, no el minuto 0: GitHub descarta crones en el pico de cada hora.
    # 11:15–22:15 UTC = 08:15 a 19:15 en San Juan (UTC−3, sin horario de verano).
    # Si la planilla no cambió, igual se publica el pronóstico de cierre cuando cambia.
    - cron: "15 11-22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: hidrologia-diaria
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils sqlite3
          python -m pip install -r tools/hidrologia/requirements.txt

      - name: Firma de la serie publicada
        run: |
          sqlite3 tools/hidrologia/caudales.db "
            CREATE TABLE IF NOT EXISTS desembalse_ullum(
              fecha DATE PRIMARY KEY, caudal_m3s REAL, fuente TEXT, descargado_en TIMESTAMP);
            SELECT fecha, printf('%.5f', caudal_m3s) FROM caudales_diarios ORDER BY fecha;
            SELECT fecha, embalse, printf('%.3f', ifnull(nivel, -1)), printf('%.3f', ifnull(volumen_hm3, -1))
              FROM niveles_embalses ORDER BY fecha, embalse;
            SELECT fecha, printf('%.3f', caudal_m3s) FROM desembalse_ullum ORDER BY fecha;
          " | sha256sum > /tmp/hidro-antes.sha

      # Falla si el sitio contesta y ninguna planilla del período se lee, o si un
      # PDF no trae fecha y mediciones. Un 404 suelto es «aún no publicada».
      - name: Bajar planillas oficiales y regenerar JSON/CSV
        run: bash tools/hidrologia/actualizar_todo.sh

      - name: Publicar si cambió la serie o el pronóstico de cierre
        id: publicar
        run: |
          set -euo pipefail
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          sqlite3 tools/hidrologia/caudales.db "
            SELECT fecha, printf('%.5f', caudal_m3s) FROM caudales_diarios ORDER BY fecha;
            SELECT fecha, embalse, printf('%.3f', ifnull(nivel, -1)), printf('%.3f', ifnull(volumen_hm3, -1))
              FROM niveles_embalses ORDER BY fecha, embalse;
            SELECT fecha, printf('%.3f', caudal_m3s) FROM desembalse_ullum ORDER BY fecha;
          " | sha256sum > /tmp/hidro-despues.sha
          serie_cambio=1
          if cmp -s /tmp/hidro-antes.sha /tmp/hidro-despues.sha; then
            serie_cambio=0
            git checkout -- tools/hidrologia/caudales.db data/hidrologia hidrologia || true
            echo "Sin datos nuevos de caudal ni de embalses. No se interpola."
            # El grado-día cambia con el día y con Open-Meteo aunque la planilla no.
            python3 tools/hidrologia/scripts/pronostico_cierre_mes.py || {
              echo "AVISO: no se pudo regenerar el pronóstico de cierre de mes." >&2
            }
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$serie_cambio" -eq 1 ]; then
            git add data/hidrologia/tabla_hidrologica.json hidrologia tools/hidrologia/caudales.db
          fi
          if [ -f data/hidrologia/pronostico_cierre_mes.json ]; then
            git add data/hidrologia/pronostico_cierre_mes.json
          fi
          if git diff --cached --quiet; then
            echo "Nada nuevo para publicar."
            exit 0
          fi
          if [ "$serie_cambio" -eq 1 ]; then
            git commit -m "Actualizar series hidrológicas oficiales y el pronóstico de cierre de mes"
          else
            git commit -m "Actualizar el pronóstico de cierre de mes"
          fi
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Pedir el deploy de GitHub Pages
        if: steps.publicar.outputs.pushed == 'true'
        run: |
          set -euo pipefail
          # Un push hecho con GITHUB_TOKEN no dispara pages-build-deployment.
          # Este sitio publica desde la rama (Pages legacy): el build se pide por la API.
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
