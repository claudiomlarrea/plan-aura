name: Hidrología diaria

on:
  schedule:
    # Minuto 15, no el minuto 0: GitHub descarta crones en el pico de cada hora.
    # 11:15–22:15 UTC = 08:15 a 19:15 en San Juan (UTC−3, sin horario de verano).
    # Si la planilla no cambió, el job no hace commit.
    - cron: "15 11-22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: hidrologia-diaria
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils sqlite3
          python -m pip install -r tools/hidrologia/requirements.txt

      - name: Firma de la serie publicada
        run: |
          sqlite3 tools/hidrologia/caudales.db "
            SELECT fecha, printf('%.5f', caudal_m3s) FROM caudales_diarios ORDER BY fecha;
            SELECT fecha, embalse, printf('%.3f', ifnull(nivel, -1))
              FROM niveles_embalses ORDER BY fecha, embalse;
          " | sha256sum > /tmp/hidro-antes.sha

      - name: Bajar planillas oficiales y regenerar JSON/CSV
        run: bash tools/hidrologia/actualizar_todo.sh

      - name: Publicar solo si la serie cambió
        id: publicar
        run: |
          set -euo pipefail
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          sqlite3 tools/hidrologia/caudales.db "
            SELECT fecha, printf('%.5f', caudal_m3s) FROM caudales_diarios ORDER BY fecha;
            SELECT fecha, embalse, printf('%.3f', ifnull(nivel, -1))
              FROM niveles_embalses ORDER BY fecha, embalse;
          " | sha256sum > /tmp/hidro-despues.sha
          if cmp -s /tmp/hidro-antes.sha /tmp/hidro-despues.sha; then
            git checkout -- tools/hidrologia/caudales.db data/hidrologia hidrologia || true
            echo "Sin datos nuevos. No se commitea nada y no se interpola."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hidrologia/tabla_hidrologica.json hidrologia tools/hidrologia/caudales.db
          if git diff --cached --quiet; then
            echo "La firma cambió pero el diff publicado está vacío."
            exit 0
          fi
          git commit -m "Actualizar series hidrológicas oficiales"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Pedir el deploy de GitHub Pages
        if: steps.publicar.outputs.pushed == 'true'
        run: |
          set -euo pipefail
          # Un push hecho con GITHUB_TOKEN no dispara pages-build-deployment.
          # Este sitio publica desde la rama (Pages legacy): el build se pide por la API.
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
